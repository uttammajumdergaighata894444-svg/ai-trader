name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 4. System dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev


      # --------------------------------------------------
      # 5. Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # 6. Install Android SDK + NDK
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |

          sdkmanager --update

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # 7. Verify Android environment
      # --------------------------------------------------
      - name: Verify Android environment
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK packages:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-33|build-tools;33.0.2|ndk;25.1.8937393"


      # --------------------------------------------------
      # 8. Install Python build tools
      # --------------------------------------------------
      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            cython==0.29.36 \
            buildozer


      # --------------------------------------------------
      # 9. Clean old Buildozer state
      # --------------------------------------------------
      - name: Clean Buildozer cache
        run: |

          rm -rf ~/.buildozer

          mkdir -p ~/.buildozer/android/platform


      # --------------------------------------------------
      # 10. Connect Buildozer to Android SDK
      # --------------------------------------------------
      - name: Configure Buildozer SDK
        run: |

          ln -s "$ANDROID_SDK_ROOT" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          ls -la "$HOME/.buildozer/android/platform/"


      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |

          export PATH="$HOME/.local/bin:$PATH"

          buildozer android clean

          buildozer -v android debug


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-APK
          path: bin/*.apk
          if-no-files-found: error

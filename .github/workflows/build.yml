[app]

# --------------------------------------------------
# Application
# --------------------------------------------------

title = AI Trader

package.name = aitrader

package.domain = org.aitrader

version = 0.1


# --------------------------------------------------
# Source
# --------------------------------------------------

source.dir = .

source.include_exts = py,png,jpg,jpeg,kv,atlas,json

source.exclude_exts = spec


# --------------------------------------------------
# Python requirements
# --------------------------------------------------

requirements = python3,kivy,websocket-client


# --------------------------------------------------
# Orientation
# --------------------------------------------------

orientation = portrait


# --------------------------------------------------
# Android permissions
# --------------------------------------------------

android.permissions = INTERNET


# --------------------------------------------------
# Android SDK
# --------------------------------------------------

android.api = 33

android.minapi = 24

android.ndk = 25b


# --------------------------------------------------
# Android build
# --------------------------------------------------

android.build_mode = debug


# --------------------------------------------------
# Python for Android
# --------------------------------------------------

p4a.bootstrap = sdl2


# --------------------------------------------------
# Logging
# --------------------------------------------------

log_level = 2


# --------------------------------------------------
# Extra settings
# --------------------------------------------------

fullscreen = 0

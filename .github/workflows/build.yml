name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          yes | sdkmanager --licenses || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36
          python -m pip install buildozer

      - name: Configure Buildozer SDK Path & Symlinks
        run: |
          mkdir -p $HOME/.buildozer/android/platform/
          
          if [ -d "$ANDROID_SDK_ROOT" ]; then
            ln -sfn "$ANDROID_SDK_ROOT" "$HOME/.buildozer/android/platform/android-sdk"
          fi

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/tools/bin"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
            ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
            ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          fi

          echo "Checking sdkmanager path..."
          ls -l "$SDK/tools/bin/sdkmanager"

      - name: Verify Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Buildozer SDK=$SDK"

          echo "sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo "Real sdkmanager:"
          ls -l "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-APK
          path: bin/*.apk
          
